<!DOCTYPE html>
<html>
  <body style="background-color:coral; text-align: center; font-family: Arial, sans-serif;">
    <h1 id="title"><p>I am a Computer Science student. I love coding!</p>
    <input id="taskInput" type="text" placeholder="Type your task here..." />
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList">
    <script>
      function addTask() {
        var task = document.getElementById("taskInput").value;
        if (task === "") {
          alert("Plaease type something");
          return;
        }
        var newItem = document.createElement("li");
        newItem.innerText = task;
        document.getElementById("taskList").appendChild(newItem);
        document.getElementById("taskInput").value = "";
      }
    </script>
  </body>
</html>
